openapi: 3.0.0
info:
  title: Keka Attendance API
  description: API endpoints for the Attendance module in Keka HR software
  version: 1.0.0

paths:
  /attendance/api/mytime/attendance/getcurrentdate:
    get:
      operationId: getCurrentDate
      summary: Get the current server date and time
      description: Returns the current date and time from the attendance server.
      responses:
        '200':
          description: Successful response with current date and time
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    format: date-time
                    description: Current server date and time in ISO 8601 format
                    example: "2026-01-12T22:27:46.9027076"
                  succeeded:
                    type: boolean
                    description: Indicates if the request was successful
                    example: true
                  message:
                    type: string
                    description: Response message (empty on success)
                    example: ""
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages (empty on success)
                    example: []

  /attendance/api/myteam/summary/{timePeriod}/attendancemetrics:
    get:
      operationId: getTeamAttendanceMetrics
      summary: Get attendance metrics summary for team members
      description: Returns attendance metrics including counts of late, on-time, and remote working employees for a specified time period.
      parameters:
        - name: timePeriod
          in: path
          required: true
          description: Time period identifier for the metrics (e.g., 4 for current period)
          schema:
            type: integer
            example: 4
        - name: groupId
          in: query
          required: false
          description: Filter by specific group ID (0 for all groups)
          schema:
            type: integer
            default: 0
            example: 0
        - name: systemGroupType
          in: query
          required: false
          description: Filter by system group type (0 for all types)
          schema:
            type: integer
            default: 0
            example: 0
      responses:
        '200':
          description: Successful response with team attendance metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totalLateEmployees:
                        type: integer
                        description: Count of employees who clocked in late
                        example: 0
                      totalOnTimeEmployees:
                        type: integer
                        description: Count of employees who clocked in on time
                        example: 0
                      totalWorkingRemotelyEmployees:
                        type: integer
                        description: Count of employees currently working remotely
                        example: 0
                      totalRemoteClockInEmployees:
                        type: integer
                        description: Count of employees who clocked in remotely
                        example: 0
                  succeeded:
                    type: boolean
                    description: Indicates if the request was successful
                    example: true
                  message:
                    type: string
                    description: Response message (empty on success)
                    example: ""
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages (empty on success)
                    example: []

  /attendance/api/employee/allpendingapprovalscount:
    get:
      operationId: getAllPendingApprovalsCount
      summary: Get count of all pending approval requests for employee
      description: Returns the count of various pending approval requests including attendance adjustments, remote clock-in, leave requests, overtime, and more.
      responses:
        '200':
          description: Successful response with pending approvals count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attendanceAdjustmentRequestCount:
                        type: integer
                        description: Number of pending attendance adjustment requests
                        example: 0
                      attendanceRemoteClockInRequestCount:
                        type: integer
                        description: Number of pending remote clock-in requests
                        example: 0
                      attendanceWorkingRemotelyRequestCount:
                        type: integer
                        description: Number of pending work from home requests
                        example: 0
                      attendancePartialDayRequestCount:
                        type: integer
                        description: Number of pending partial day requests
                        example: 0
                      overtimeRequestCount:
                        type: integer
                        description: Number of pending overtime requests
                        example: 0
                      leaveRequestCount:
                        type: integer
                        description: Number of pending leave requests
                        example: 42
                      compoffRequestCount:
                        type: integer
                        description: Number of pending compensatory off requests
                        example: 0
                      shiftRequestCount:
                        type: integer
                        description: Number of pending shift change requests
                        example: 0
                      weeklyOffRequestCount:
                        type: integer
                        description: Number of pending weekly off requests
                        example: 0
                      leaveEncashmentRequestCount:
                        type: integer
                        description: Number of pending leave encashment requests
                        example: 0
                  succeeded:
                    type: boolean
                    description: Indicates if the request was successful
                    example: true
                  message:
                    type: string
                    description: Response message (empty on success)
                    example: ""
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages (empty on success)
                    example: []

components:
  schemas:
    StandardResponse:
      type: object
      description: Standard response wrapper used by all Keka API endpoints
      properties:
        data:
          description: The response payload (varies by endpoint)
        succeeded:
          type: boolean
          description: Indicates if the request was successful
        message:
          type: string
          description: Response message (typically empty on success)
        errors:
          type: array
          items:
            type: string
          description: List of error messages (empty on success)

    AttendanceMetrics:
      type: object
      description: Team attendance metrics summary
      properties:
        totalLateEmployees:
          type: integer
          description: Count of employees who clocked in late
        totalOnTimeEmployees:
          type: integer
          description: Count of employees who clocked in on time
        totalWorkingRemotelyEmployees:
          type: integer
          description: Count of employees currently working remotely
        totalRemoteClockInEmployees:
          type: integer
          description: Count of employees who clocked in remotely

    PendingApprovalsCount:
      type: object
      description: Count of various pending approval requests
      properties:
        attendanceAdjustmentRequestCount:
          type: integer
          description: Number of pending attendance adjustment requests
        attendanceRemoteClockInRequestCount:
          type: integer
          description: Number of pending remote clock-in requests
        attendanceWorkingRemotelyRequestCount:
          type: integer
          description: Number of pending work from home requests
        attendancePartialDayRequestCount:
          type: integer
          description: Number of pending partial day requests
        overtimeRequestCount:
          type: integer
          description: Number of pending overtime requests
        leaveRequestCount:
          type: integer
          description: Number of pending leave requests
        compoffRequestCount:
          type: integer
          description: Number of pending compensatory off requests
        shiftRequestCount:
          type: integer
          description: Number of pending shift change requests
        weeklyOffRequestCount:
          type: integer
          description: Number of pending weekly off requests
        leaveEncashmentRequestCount:
          type: integer
          description: Number of pending leave encashment requests
