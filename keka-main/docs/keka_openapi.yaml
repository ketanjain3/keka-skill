      operationId: getPendingApprovalCount
      summary: Get counts of pending timesheet and related approvals
      tags:
      - Timesheet Approvals
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PendingApprovalCount'
  /timesheet/resourcesettings:
    get:
      operationId: getResourceSettings
      summary: Get resource allocation and request settings configuration
      tags:
      - Timesheet Settings
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceSettings'
  /welcomescreen/details:
    get:
      operationId: getWelcomeScreenDetails
      summary: Get welcome screen details for current employee
      tags:
      - welcome
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/WelcomeScreenDetails'
  /welcomescreen/logindate:
    get:
      operationId: getLastLoginDate
      summary: Get last login date for current user
      tags:
      - welcome
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      type: string
                      format: date-time
  /welcomescreen/onboardingresources:
    get:
      operationId: getOnboardingResources
      summary: Get onboarding resources (HR contacts) for new employees
      tags:
      - welcome
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/EmployeeSummary'
  /welcomescreen/quicklinks:
    get:
      operationId: getQuickLinks
