openapi: 3.0.3
info:
  title: Keka HR - Default Module API
  description: |
    API endpoints for the Default module of Keka HR software.
    This module contains various sub-categories including:
    - Lookup APIs (departments, locations, currencies, countries, job titles, etc.)
    - Organization dashboard APIs (employee counts, birthdays, anniversaries, etc.)
    - Exit/Resignation APIs
    - Expense management APIs
    - Inbox/Approval APIs
    - Employee profile APIs
    - Storyboard/Attrition analytics APIs
    - Welcome screen APIs
  version: 1.0.0
  contact:
    name: Keka HR API Support

servers:
  - url: https://{tenant}.keka.com/k/default/api
    variables:
      tenant:
        default: demo
        description: Tenant subdomain

tags:
  - name: lookup
    description: Lookup APIs for reference data (departments, locations, currencies, etc.)
  - name: organization
    description: Organization dashboard and summary APIs
  - name: exit
    description: Exit and resignation management APIs
  - name: expense
    description: Expense management and claims APIs
  - name: inbox
    description: Inbox and approval workflow APIs
  - name: employee
    description: Employee profile and details APIs
  - name: storyboard
    description: Storyboard and attrition analytics APIs
  - name: welcome
    description: Welcome screen and onboarding APIs
  - name: reachout
    description: Reachout and social post APIs
  - name: ceo
    description: CEO dashboard and insights APIs

paths:
  # ============================================
  # STORYBOARD / ATTRITION ANALYTICS APIs
  # ============================================
  /storyboard/attrition/user/hasaccess:
    get:
      operationId: checkAttritionUserAccess
      summary: Check if current user has access to attrition analytics
      tags:
        - storyboard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanResponse'

  /storyboard/attrition/user/all:
    get:
      operationId: getAttritionUsers
      summary: Get all attrition storyboard users
      tags:
        - storyboard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayResponse'

  /storyboard/attrition/ask-ai/get-all-prompts:
    get:
      operationId: getAttritionAiPrompts
      summary: Get AI prompts for attrition analytics widget
      tags:
        - storyboard
      parameters:
        - name: widgetName
          in: query
          required: true
          description: Name of the widget (e.g., organisationtenure, departmentwise, exitreason, performancewise, overallexitratings)
          schema:
            type: string
            enum:
              - organisationtenure
              - departmentwise
              - exitreason
              - performancewise
              - overallexitratings
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AttritionPrompt'

  /org/storyboard/attrition/getratingscales:
    get:
      operationId: getAttritionRatingScales
      summary: Get rating scales for attrition analytics
      tags:
        - storyboard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: '#/components/schemas/RatingScale'
                          success:
                            type: boolean

  # ============================================
  # LOOKUP APIs
  # ============================================
  /lookup/departments:
    get:
      operationId: getDepartments
      summary: Get list of all departments
      tags:
        - lookup
      parameters:
        - name: includeArchivedGroups
          in: query
          required: false
          description: Include archived departments in the response
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Department'

  /lookup/legalentities:
    get:
      operationId: getLegalEntities
      summary: Get list of all legal entities
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizationGroup'

  /lookup/businessunits:
    get:
      operationId: getBusinessUnits
      summary: Get list of all business units
      tags:
        - lookup
      parameters:
        - name: includeArchivedGroups
          in: query
          required: false
          description: Include archived business units in the response
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizationGroup'

  /lookup/contingenttypes:
    get:
      operationId: getContingentTypes
      summary: Get list of contingent worker types (Contract, Intern, Consultant)
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ContingentType'

  /lookup/locations:
    get:
      operationId: getLocations
      summary: Get list of all office locations
      tags:
        - lookup
      parameters:
        - name: includeArchivedGroups
          in: query
          required: false
          description: Include archived locations in the response
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizationGroup'

  /lookup/availablegenders:
    get:
      operationId: getAvailableGenders
      summary: Get available gender options by country
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            $ref: '#/components/schemas/GenderOption'

  /lookup/terminationreasons:
    get:
      operationId: getTerminationReasons
      summary: Get list of termination reasons
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExitReason'

  /lookup/resignationreasons:
    get:
      operationId: getResignationReasons
      summary: Get list of resignation reasons
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExitReason'

  /lookup/countries:
    get:
      operationId: getCountries
      summary: Get list of all countries with dial codes and currency info
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Country'

  /lookup/basecurrencies:
    get:
      operationId: getBaseCurrencies
      summary: Get organization's base currencies
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Currency'

  /lookup/currencies:
    get:
      operationId: getCurrencies
      summary: Get list of all available currencies
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Currency'

  /lookup/expensecategories:
    get:
      operationId: getExpenseCategories
      summary: Get list of expense categories
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExpenseCategory'

  /lookup/costcenters:
    get:
      operationId: getCostCenters
      summary: Get list of cost centers
      tags:
        - lookup
      parameters:
        - name: includeArchivedGroups
          in: query
          required: false
          description: Include archived cost centers in the response
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizationGroup'

  /lookup/globalfilterlist:
    get:
      operationId: getGlobalFilterList
      summary: Get global filter list for employee filtering by groups
      tags:
        - lookup
      parameters:
        - name: applyVisibilityRestrictionOnFilters
          in: query
          required: false
          description: Apply visibility restrictions based on user permissions
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GlobalFilterGroup'

  /lookup/approvalchainrolesearchitems:
    get:
      operationId: getApprovalChainRoles
      summary: Get approval chain role types for workflow configuration
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApprovalChainRole'

  /lookup/explicitroles:
    get:
      operationId: getExplicitRoles
      summary: Get explicit system roles (Admin, HR Manager, etc.)
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExplicitRole'

  /lookup/jobtitles:
    get:
      operationId: getJobTitles
      summary: Get list of job titles
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/JobTitle'

  /lookup/paygroups:
    get:
      operationId: getPayGroups
      summary: Get list of pay groups
      tags:
        - lookup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizationGroup'

  # ============================================
  # WELCOME SCREEN APIs
  # ============================================
  /welcomescreen/details:
    get:
      operationId: getWelcomeScreenDetails
      summary: Get welcome screen details for current employee
      tags:
        - welcome
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WelcomeScreenDetails'

  /welcomescreen/logindate:
    get:
      operationId: getLastLoginDate
      summary: Get last login date for current user
      tags:
        - welcome
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: string
                        format: date-time

  /welcomescreen/onboardingresources:
    get:
      operationId: getOnboardingResources
      summary: Get onboarding resources (HR contacts) for new employees
      tags:
        - welcome
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EmployeeSummary'

  /welcomescreen/quicklinks:
    get:
      operationId: getQuickLinks
      summary: Get quick links for welcome screen
      tags:
        - welcome
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullableDataResponse'

  # ============================================
  # REACHOUT / SOCIAL POST APIs
  # ============================================
  /reachout/post/content/{postId}:
    get:
      operationId: getPostContent
      summary: Get content details of a social post
      tags:
        - reachout
      parameters:
        - name: postId
          in: path
          required: true
          description: UUID of the post
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PostContent'

  /reachout/{widgetType}/{postId}/reaction-aggregates:
    get:
      operationId: getReactionAggregates
      summary: Get reaction aggregates for a widget post
      tags:
        - reachout
      parameters:
        - name: widgetType
          in: path
          required: true
          description: Type of widget (orgattritiondepartmentwise, orgattritionorganisationtenure, etc.)
          schema:
            type: string
            enum:
              - orgattritiondepartmentwise
              - orgattritionorganisationtenure
              - orgattritionperformancewise
              - orgattritionexitreason
              - orgattritionoverallexitratings
        - name: postId
          in: path
          required: true
          description: UUID of the post
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReactionAggregates'

  # ============================================
  # EMPLOYEE APIs
  # ============================================
  /employee/{employeeId}/quickie/job/details:
    get:
      operationId: getEmployeeJobDetails
      summary: Get quick job details for an employee
      tags:
        - employee
      parameters:
        - name: employeeId
          in: path
          required: true
          description: Numeric employee ID
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmployeeJobDetails'

  /profile/changes/pending/count:
    get:
      operationId: getPendingProfileChangesCount
      summary: Get count of pending profile changes for current user
      tags:
        - employee
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegerResponse'

  /compositeviews/{viewType}/employeepublicview/{viewName}:
    get:
      operationId: getCompositeView
      summary: Get composite view configuration for employee public view
      tags:
        - employee
      parameters:
        - name: viewType
          in: path
          required: true
          description: View type identifier
          schema:
            type: integer
        - name: viewName
          in: path
          required: true
          description: Name of the view
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CompositeView'

  # ============================================
  # INBOX / APPROVAL APIs
  # ============================================
  /inbox/pendingapprovalscount:
    get:
      operationId: getPendingApprovalsCount
      summary: Get count of pending approvals by category
      tags:
        - inbox
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PendingApprovalsCount'

  /inboxarchive/requestscount:
    get:
      operationId: getArchivedRequestsCount
      summary: Get count of archived requests by category
      tags:
        - inbox
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PendingApprovalsCount'

  /inbox/asset/acknowledgement:
    get:
      operationId: getAssetAcknowledgements
      summary: Get pending asset acknowledgement requests
      tags:
        - inbox
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AssetAcknowledgementRequest'

  /inbox/asset/acknowledgement/{requestIdentifier}:
    get:
      operationId: getAssetAcknowledgementDetails
      summary: Get details of a specific asset acknowledgement request
      tags:
        - inbox
      parameters:
        - name: requestIdentifier
          in: path
          required: true
          description: UUID of the acknowledgement request
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssetAcknowledgementDetails'

  /comment/comments:
    get:
      operationId: getComments
      summary: Get comments for a specific item
      tags:
        - inbox
      parameters:
        - name: commentIdentifier
          in: query
          required: true
          description: UUID identifier for the comment thread
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayResponse'

  # ============================================
  # MY TEAM APIs
  # ============================================
  /myteam/profile/changes/pending/count:
    get:
      operationId: getTeamPendingProfileChangesCount
      summary: Get count of pending profile changes for team members
      tags:
        - organization
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegerResponse'

  /myteamemployees/ps/approval/requests/count:
    get:
      operationId: getTeamApprovalRequestsCount
      summary: Get count of pending approval requests for team members
      tags:
        - organization
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TeamApprovalRequestsCount'

  /myteam/summary/{limit}/notinyet:
    get:
      operationId: getTeamNotInYet
      summary: Get team members who have not clocked in yet
      tags:
        - organization
      parameters:
        - name: limit
          in: path
          required: true
          description: Maximum number of employees to return
          schema:
            type: integer
        - name: groupId
          in: query
          required: false
          description: Filter by group ID (0 for all)
          schema:
            type: integer
            default: 0
        - name: systemGroupType
          in: query
          required: false
          description: Filter by system group type (0 for all)
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EmployeeBasicInfo'

  # ============================================
  # ORGANIZATION DASHBOARD APIs
  # ============================================
  /org/selfonboarding:
    get:
      operationId: getSelfOnboardingStatus
      summary: Get self-onboarding status for the organization
      tags:
        - organization
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SelfOnboardingStatus'

  /org/dashboard/employeescount:
    get:
      operationId: getEmployeesCount
      summary: Get organization-wide employee counts
      tags:
        - organization
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmployeesCount'

  /org/dashboard/pendingactions:
    get:
      operationId: getPendingActions
      summary: Get pending actions count for organization dashboard
      tags:
        - organization
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PendingActions'

  /org/dashboard/comingbirthdays:
    get:
      operationId: getComingBirthdays
      summary: Get employees with upcoming birthdays
      tags:
        - organization
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EmployeeProfile'

  /org/dashboard/comingworkanniversaries:
    get:
      operationId: getComingWorkAnniversaries
      summary: Get employees with upcoming work anniversaries
      tags:
        - organization
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EmployeeProfile'

  /org/dashboard/onboardingemployeessummary:
    get:
      operationId: getOnboardingEmployeesSummary
      summary: Get summary of employees in onboarding process
      tags:
        - organization
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
