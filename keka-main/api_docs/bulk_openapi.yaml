openapi: 3.0.3
info:
  title: Keka HR Bulk Module API
  description: API endpoints for the Bulk module including Report Builder, File Export, and Expense Claims
  version: 1.0.0

paths:
  /k/bulk/api/fileexport/exportrequest/:
    get:
      operationId: requestFileExport
      summary: Request a file export for a specific data type
      description: Initiates a file export request for various HR data types such as exits under review, exits in progress, exit completed, or current CTC report.
      parameters:
        - name: fileExportIdentifier
          in: query
          required: true
          description: Identifier specifying the type of data to export (e.g., exitsunderreview, exitsinprogress, exitcompleted, currentctcreport)
          schema:
            type: string
            enum:
              - exitsunderreview
              - exitsinprogress
              - exitcompleted
              - currentctcreport
      responses:
        '200':
          description: Export request initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponseNull'

  /k/bulk/api/expense/claims/approved:
    get:
      operationId: getApprovedExpenseClaims
      summary: Retrieve approved expense claims
      description: Returns a list of approved expense claims, optionally filtered by settlement status.
      parameters:
        - name: isSettlementClaims
          in: query
          required: false
          description: Filter to show only settlement claims (true) or non-settlement claims (false)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of approved expense claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedExpenseClaimsResponse'

  /k/bulk/api/report-builder/categories:
    get:
      operationId: getReportCategories
      summary: Get available report categories for a module
      description: Returns all report categories available for the specified module (e.g., payroll).
      parameters:
        - name: moduleName
          in: query
          required: true
          description: The module name to retrieve categories for (e.g., payroll)
          schema:
            type: string
      responses:
        '200':
          description: List of report categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCategoriesResponse'

  /k/bulk/api/report-builder/favourites:
    get:
      operationId: getFavouriteReports
      summary: Get user's favourite reports for a module
      description: Returns the list of reports marked as favourites by the user for the specified module.
      parameters:
        - name: moduleName
          in: query
          required: true
          description: The module name to retrieve favourite reports for (e.g., payroll)
          schema:
            type: string
      responses:
        '200':
          description: List of favourite reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavouriteReportsResponse'

  /k/bulk/api/report-builder/recently-viewed:
    get:
      operationId: getRecentlyViewedReports
      summary: Get recently viewed reports for a module
      description: Returns the list of reports recently viewed by the user for the specified module.
      parameters:
        - name: moduleName
          in: query
          required: true
          description: The module name to retrieve recently viewed reports for (e.g., payroll)
          schema:
            type: string
      responses:
        '200':
          description: List of recently viewed reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentlyViewedReportsResponse'

  /k/bulk/api/report-builder/report-definitions:
    get:
      operationId: getReportDefinitionsByCategory
      summary: Get report definitions for a specific category
      description: Returns all report definitions available under a specific report category.
      parameters:
        - name: categoryId
          in: query
          required: true
          description: The UUID of the report category to retrieve definitions for
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of report definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDefinitionsResponse'

  /k/bulk/api/report-builder/report-definitions/filterbySlug:
    get:
      operationId: getReportDefinitionBySlug
      summary: Get detailed report definition by slug
      description: Returns the full report definition including columns, conditions, and parameters for a specific report identified by its slug.
      parameters:
        - name: slug
          in: query
          required: true
          description: The unique slug identifier for the report (e.g., currentctc)
          schema:
            type: string
      responses:
        '200':
          description: Detailed report definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDefinitionDetailResponse'

components:
  schemas:
    StandardResponseNull:
      type: object
      properties:
        data:
          type: object
          nullable: true
        succeeded:
          type: boolean
          description: Indicates if the operation was successful
        message:
          type: string
          description: Response message, empty on success
        errors:
          type: array
          items:
            type: string
          description: List of error messages if any
      required:
        - data
        - succeeded
        - message
        - errors

    Currency:
      type: object
      properties:
        id:
          type: integer
          description: Currency ID
        code:
          type: string
          description: Currency code (e.g., INR)
        name:
          type: string
          description: Currency name (e.g., India Rupee)
        symbol:
          type: string
          nullable: true
          description: Currency symbol
        sortOrder:
          type: integer
          description: Sort order for display
        precision:
          type: integer
          description: Decimal precision for the currency
        currencyName:
          type: string
          nullable: true
          description: Alternative currency name
        subUnit:
          type: string
          nullable: true
          description: Sub-unit name (e.g., paise for INR)

    ExpenseClaim:
      type: object
      properties:
        id:
          type: integer
          description: Unique claim ID
        employeeId:
          type: integer
          description: Employee ID who submitted the claim
        title:
          type: string
          description: Title/description of the expense claim
        claimNumber:
          type: string
          description: Unique claim number (e.g., #EXP00460)
        employeeNumber:
          type: string
          description: Employee number
        employeeName:
          type: string
          description: Full name of the employee
        businessUnit:
          type: string
          description: Business unit of the employee
        parentDepartmentName:
          type: string
          nullable: true
          description: Parent department name if applicable
        departmentName:
          type: string
          description: Department name
        costCenter:
          type: string
          nullable: true
          description: Cost center for the expense
        locationName:
          type: string
          description: Location of the employee
        jobTitle:
          type: string
          description: Job title of the employee
        expenseIds:
          type: array
          items:
            type: integer
          description: List of expense IDs included in this claim
        baseCurrency:
          $ref: '#/components/schemas/Currency'
        totalAmount:
          type: number
          format: double
          description: Total amount of the claim
        claimedAmount:
          type: number
          format: double
          description: Amount claimed by employee
        totalExpenses:
          type: integer
          description: Number of expenses in the claim
        approvalStatus:
          type: integer
          description: Approval status code (3 = approved)
        advanceRequestId:
          type: integer
          description: Associated advance request ID if any (0 if none)
        submittedOn:
          type: string
          format: date-time
          description: Date and time when claim was submitted
        payDate:
          type: string
          format: date
          nullable: true
          description: Scheduled pay date
        paymentDate:
          type: string
          format: date
          description: Actual payment date
        approverName:
          type: string
          description: Name of the person who approved the claim
        approvedOn:
          type: string
          format: date
          description: Date when claim was approved
        paymentMode:
          type: integer
          description: Payment mode code
        advanceAmount:
          type: number
          nullable: true
          description: Advance amount if applicable
        advanceRequestPayDate:
          type: string
          format: date
          nullable: true
          description: Advance request pay date if applicable

    ApprovedExpenseClaimsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseClaim'
        succeeded:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: string
      required:
        - data
        - succeeded
        - message
        - errors

    ReportCategory:
      type: object
      properties:
        reportCategoryId:
          type: string
          format: uuid
          description: Unique identifier for the report category
        name:
          type: string
          description: Display name of the category
        description:
          type: string
          description: Description of the category
        uniqueName:
          type: string
          description: Unique name identifier (e.g., payroll_payrollreports)

    ReportCategoriesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportCategory'
        succeeded:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: string
      required:
        - data
        - succeeded
        - message
        - errors

    ReportDefinitionSummary:
      type: object
      properties:
        categoryName:
          type: string
          description: Name of the parent category
        moduleName:
          type: string
          description: Module the report belongs to
        isFavourite:
          type: boolean
          description: Whether the report is marked as favourite
        hasSchedule:
          type: boolean
          description: Whether the report has a schedule configured
        isPrivate:
          type: boolean
          description: Whether the report is private
        version:
          type: integer
          description: Version number of the report definition
        reportDefinitionId:
          type: string
          format: uuid
          description: Unique identifier for the report definition
        name:
          type: string
          description: Display name of the report
        description:
          type: string
          description: Description of what the report contains
        slug:
          type: string
          description: URL-friendly identifier for the report
        reportCategoryId:
          type: string
          format: uuid
          description: ID of the parent category
        isCustomReport:
          type: boolean
          description: Whether this is a custom report

    ReportDefinitionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportDefinitionSummary'
        succeeded:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: string
      required:
        - data
        - succeeded
        - message
        - errors

    FavouriteReportsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportDefinitionSummary'
        succeeded:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: string
      required:
        - data
        - succeeded
        - message
        - errors

    RecentlyViewedReportsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportDefinitionSummary'
        succeeded:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: string
      required:
        - data
        - succeeded
        - message
        - errors

    Aggregations:
      type: object
      properties:
        rowSelection:
          type: array
          items:
            type: object
          description: Row selection aggregations
        valueSelection:
          type: array
          items:
            type: object
          description: Value selection aggregations

    ReportDefinitionDetail:
      type: object
      properties:
        reportTypeId:
          type: string
          nullable: true
          description: Type identifier for the report
        columns:
          type: array
          items:
            type: object
          description: Column definitions for the report
        conditions:
          type: array
          items:
            type: object
          description: Filter conditions for the report
        groupBy:
          type: array
          items:
            type: object
          description: Grouping configuration
        orderBy:
          type: array
          items:
            type: object
          description: Sorting configuration
        parameters:
          type: array
          items:
            type: object
          description: Report parameters
        searchableColumns:
          type: array
          items:
            type: object
          description: Columns that can be searched
        isFavourite:
          type: boolean
          description: Whether the report is marked as favourite
        isPrivate:
          type: boolean
          description: Whether the report is private
        canSchedule:
          type: boolean
          description: Whether the report can be scheduled
        aggregations:
          $ref: '#/components/schemas/Aggregations'
        version:
          type: integer
          description: Version number of the report definition
        reportDefinitionId:
          type: string
          format: uuid
          description: Unique identifier for the report definition
        name:
          type: string
          description: Display name of the report
        description:
          type: string
          description: Description of what the report contains
        slug:
          type: string
          description: URL-friendly identifier for the report
        reportCategoryId:
          type: string
          format: uuid
          description: ID of the parent category
        isCustomReport:
          type: boolean
          description: Whether this is a custom report

    ReportDefinitionDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ReportDefinitionDetail'
        succeeded:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: string
      required:
        - data
        - succeeded
        - message
        - errors
