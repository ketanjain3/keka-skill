openapi: 3.0.3
info:
  title: Keka Engage API
  description: API endpoints for the Keka Engage module (employee engagement)
  version: 1.0.0

paths:
  /engage/api/v1/employees/me/pulse/responses:
    get:
      operationId: getMyPulseResponses
      summary: Retrieve the current employee's pulse survey responses
      tags:
        - Pulse
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /engage/api/v1/employees/me/surveys/pending:
    get:
      operationId: getMyPendingSurveys
      summary: Retrieve pending surveys for the current employee
      tags:
        - Surveys
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyListResponse'

  /engage/api/v1/employees/me/announcements:
    get:
      operationId: getMyAnnouncements
      summary: Retrieve announcements for the current employee
      tags:
        - Announcements
      parameters:
        - name: pageNumber
          in: query
          description: Page number for pagination (1-indexed)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 6
        - name: wallType
          in: query
          description: Type of announcement wall to filter by
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementListResponse'

components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates whether the request was successful
      required:
        - success

    SurveyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Survey'
          description: List of pending surveys
        success:
          type: boolean
          description: Indicates whether the request was successful
      required:
        - data
        - success

    Survey:
      type: object
      description: Survey object (structure to be determined based on actual data)

    AnnouncementListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
          description: List of announcements
        currentPage:
          type: integer
          description: Current page number
        pageSize:
          type: integer
          description: Number of items per page
        totalCount:
          type: integer
          description: Total number of items across all pages
        totalPages:
          type: integer
          description: Total number of pages
        success:
          type: boolean
          description: Indicates whether the request was successful
      required:
        - data
        - currentPage
        - pageSize
        - totalCount
        - totalPages
        - success

    Announcement:
      type: object
      description: Announcement object (structure to be determined based on actual data)
