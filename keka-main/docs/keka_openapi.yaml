openapi: 3.0.3
info:
  title: Keka HR API
  description: Complete OpenAPI specification for Keka HR software GET APIs. Keka
    is a comprehensive HR management platform covering attendance, leave, payroll,
    timesheet, expense management, and more.
  version: 1.0.0
  contact:
    name: Keka HR
    url: https://www.keka.com
servers:
- url: https://{tenant}.keka.com
  description: Keka API Server
  variables:
    tenant:
      default: your-tenant
      description: Your Keka tenant identifier
paths:
  //organization/expensesettings:
    get:
      operationId: getOrganizationExpenseSettings
      summary: Get organization expense settings
      tags:
      - expense
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OrganizationExpenseSettings'
  /CeoDashboard/pendingApprovers:
    get:
      operationId: getCeoPendingApprovers
      summary: Get list of approvers with pending items
      tags:
      - ceo
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PendingApprover'
  /CeoDashboard/projectUnsubmittedTimesheet:
    get:
      operationId: getCeoDashboardUnsubmittedTimesheets
      summary: Get list of employees with unsubmitted timesheets for CEO dashboard
      tags:
      - CEO Dashboard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/UnsubmittedTimesheetEmployee'
  /CeoDashboard/projectstats:
    get:
      operationId: getCeoDashboardProjectStats
      summary: Get project financial statistics for CEO dashboard
      tags:
      - CEO Dashboard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ProjectStats'
  /Insights/getceoinsights:
    get:
      operationId: getCeoInsights
      summary: Get CEO dashboard insights
      tags:
      - ceo
      parameters:
      - name: viewAllInsights
        in: query
        required: false
        description: View all insights or limited set
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CeoInsights'
  /api/dashboard/configurations:
    get:
      operationId: getDashboardConfigurations
      summary: Retrieve dashboard widget configurations for the current user
      tags:
      - Dashboard
      responses:
        '200':
          description: Dashboard configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardConfigurationResponse'
  /api/dashboard/holidays:
    get:
      operationId: getDashboardHolidays
      summary: Get list of holidays for the current user
      tags:
      - Dashboard
      responses:
        '200':
          description: Holidays retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidaysResponse'
  /api/dashboard/onleavetoday:
    get:
      operationId: getOnLeaveToday
      summary: Get paginated list of employees on leave today
      tags:
      - Dashboard
      parameters:
      - name: pageSize
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 6
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: On leave today list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnLeaveTodayResponse'
  /api/dashboard/teamworkingremotely:
    get:
      operationId: getTeamWorkingRemotely
      summary: Get paginated list of team members working remotely today
      tags:
      - Dashboard
      parameters:
      - name: pageSize
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 6
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Team working remotely list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamWorkingRemotelyResponse'
  /api/dashboard/wall/birthdays:
    get:
      operationId: getWallBirthdays
      summary: Get list of employees with birthdays around the specified date
      tags:
      - Wall
      parameters:
      - name: currentDate
        in: query
        description: Date to get birthdays for (YYYY-MM-DD format)
        required: true
        schema:
          type: string
          format: date
          example: '2026-01-12'
      responses:
        '200':
          description: Birthdays retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BirthdaysResponse'
  /api/dashboard/wall/todayeventsstats:
    get:
      operationId: getTodayEventStats
      summary: Get statistics for today's events (birthdays, anniversaries, new joinees)
      tags:
      - Wall
      parameters:
      - name: currentDate
        in: query
        description: Date to get stats for (YYYY-MM-DD format)
        required: true
        schema:
          type: string
          format: date
          example: '2026-01-12'
      responses:
        '200':
          description: Today's event statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayEventStatsResponse'
  /api/dashboard/wall/wallsettings:
    get:
      operationId: getWallSettings
      summary: Get wall feature settings and permissions
      tags:
      - Wall
      responses:
        '200':
          description: Wall settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WallSettingsResponse'
  /api/employee/surveys/active:
    get:
      operationId: getActiveSurveys
      summary: Get list of active employee surveys
      tags:
      - Surveys
      responses:
        '200':
          description: Active surveys retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveSurveysResponse'
  /api/holiday/settings/leavetype/floatername:
    get:
      operationId: getFloaterLeaveName
      summary: Get the display name for floater leave type
      tags:
      - Holiday Settings
      responses:
        '200':
          description: Floater leave name retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloaterLeaveNameResponse'
  /api/inbox/pendingapprovalscount:
    get:
      operationId: getPendingApprovalsCount
      summary: Get count of pending approval requests by category
      tags:
      - Inbox
      responses:
        '200':
          description: Pending approvals count retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingApprovalsCountResponse'
  /api/me/leave/isleaveplanassigned:
    get:
      operationId: getIsLeavePlanAssigned
      summary: Check if a leave plan is assigned to the current employee
      tags:
      - Leave
      responses:
        '200':
          description: Leave plan assignment status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsLeavePlanAssignedResponse'
  /api/me/leave/summary:
    get:
      operationId: getLeaveSummary
      summary: Get leave summary including balances, transactions, and history
      tags:
      - Leave
      parameters:
      - name: forDate
        in: query
        description: Date to get leave summary for (YYYY-MM-DD format)
        required: true
        schema:
          type: string
          format: date
          example: '2026-01-12'
      responses:
        '200':
          description: Leave summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveSummaryResponse'
  /api/me/weeklyoffpolicy:
    get:
      operationId: getWeeklyOffPolicy
      summary: Get weekly off policy for the current employee
      tags:
      - Leave
      responses:
        '200':
          description: Weekly off policy retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyOffPolicyResponse'
  /api/mytime/attendance/attendancecapturescheme:
    get:
      operationId: getAttendanceCaptureScheme
      summary: Get attendance capture scheme configuration for the current employee
      tags:
      - Attendance
      responses:
        '200':
          description: Attendance capture scheme retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCaptureSchemeResponse'
  /api/mytime/attendance/attendancedayrequests:
    get:
      operationId: getAttendanceDayRequests
      summary: Get attendance day requests (WFH, on-duty, clock-in entries)
      tags:
      - Attendance
      responses:
        '200':
          description: Attendance day requests retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceDayRequestsResponse'
  /api/mytime/attendance/attendancemodulestatus:
    get:
      operationId: getAttendanceModuleStatus
      summary: Get attendance module status for the current employee
      tags:
      - Attendance
      responses:
        '200':
          description: Attendance module status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceModuleStatusResponse'
  /api/mytime/attendance/shiftweekoffdetails:
    get:
      operationId: getShiftWeekOffDetails
      summary: Get shift and week-off details for the current employee
      tags:
      - Attendance
      responses:
        '200':
          description: Shift week-off details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftWeekOffDetailsResponse'
  /api/wall/post:
    get:
      operationId: getWallPosts
      summary: Retrieve paginated wall posts
      tags:
      - Wall
      parameters:
      - name: pageIndex
        in: query
        description: Page number (1-indexed)
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: pageSize
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 5
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Wall posts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WallPostsResponse'
  /attendance/api/employee/allpendingapprovalscount:
    get:
      operationId: getAllPendingApprovalsCount
      summary: Get count of all pending approval requests for employee
      description: Returns the count of various pending approval requests including
        attendance adjustments, remote clock-in, leave requests, overtime, and more.
      responses:
        '200':
          description: Successful response with pending approvals count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      attendanceAdjustmentRequestCount:
                        type: integer
                        description: Number of pending attendance adjustment requests
                        example: 0
                      attendanceRemoteClockInRequestCount:
                        type: integer
                        description: Number of pending remote clock-in requests
                        example: 0
                      attendanceWorkingRemotelyRequestCount:
                        type: integer
                        description: Number of pending work from home requests
                        example: 0
                      attendancePartialDayRequestCount:
                        type: integer
                        description: Number of pending partial day requests
                        example: 0
                      overtimeRequestCount:
                        type: integer
                        description: Number of pending overtime requests
                        example: 0
                      leaveRequestCount:
                        type: integer
                        description: Number of pending leave requests
                        example: 42
                      compoffRequestCount:
                        type: integer
                        description: Number of pending compensatory off requests
                        example: 0
                      shiftRequestCount:
                        type: integer
                        description: Number of pending shift change requests
                        example: 0
                      weeklyOffRequestCount:
                        type: integer
                        description: Number of pending weekly off requests
                        example: 0
                      leaveEncashmentRequestCount:
                        type: integer
                        description: Number of pending leave encashment requests
                        example: 0
                  succeeded:
                    type: boolean
                    description: Indicates if the request was successful
                    example: true
                  message:
                    type: string
                    description: Response message (empty on success)
                    example: ''
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages (empty on success)
                    example: []
  /attendance/api/myteam/summary/{timePeriod}/attendancemetrics:
    get:
      operationId: getTeamAttendanceMetrics
      summary: Get attendance metrics summary for team members
      description: Returns attendance metrics including counts of late, on-time, and
        remote working employees for a specified time period.
      parameters:
      - name: timePeriod
        in: path
        required: true
        description: Time period identifier for the metrics (e.g., 4 for current period)
        schema:
          type: integer
          example: 4
      - name: groupId
        in: query
        required: false
        description: Filter by specific group ID (0 for all groups)
        schema:
          type: integer
          default: 0
          example: 0
      - name: systemGroupType
        in: query
        required: false
        description: Filter by system group type (0 for all types)
        schema:
          type: integer
          default: 0
          example: 0
      responses:
        '200':
          description: Successful response with team attendance metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totalLateEmployees:
                        type: integer
                        description: Count of employees who clocked in late
                        example: 0
                      totalOnTimeEmployees:
                        type: integer
                        description: Count of employees who clocked in on time
                        example: 0
                      totalWorkingRemotelyEmployees:
                        type: integer
                        description: Count of employees currently working remotely
                        example: 0
                      totalRemoteClockInEmployees:
                        type: integer
                        description: Count of employees who clocked in remotely
                        example: 0
                  succeeded:
                    type: boolean
                    description: Indicates if the request was successful
                    example: true
                  message:
                    type: string
                    description: Response message (empty on success)
                    example: ''
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages (empty on success)
                    example: []
  /attendance/api/mytime/attendance/getcurrentdate:
    get:
      operationId: getCurrentDate
      summary: Get the current server date and time
      description: Returns the current date and time from the attendance server.
      responses:
        '200':
          description: Successful response with current date and time
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    format: date-time
                    description: Current server date and time in ISO 8601 format
                    example: '2026-01-12T22:27:46.9027076'
                  succeeded:
                    type: boolean
                    description: Indicates if the request was successful
                    example: true
                  message:
                    type: string
                    description: Response message (empty on success)
                    example: ''
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages (empty on success)
                    example: []
  /client/all:
    get:
      operationId: getAllClients
      summary: Get all clients with their project counts and managers
      tags:
      - Clients
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Client'
  /comment/comments:
    get:
      operationId: getComments
      summary: Get comments for a specific item
      tags:
      - inbox
      parameters:
      - name: commentIdentifier
        in: query
        required: true
        description: UUID identifier for the comment thread
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayResponse'
  /compositeviews/{viewType}/employeepublicview/{viewName}:
    get:
      operationId: getCompositeView
      summary: Get composite view configuration for employee public view
      tags:
      - employee
      parameters:
      - name: viewType
        in: path
        required: true
        description: View type identifier
        schema:
          type: integer
      - name: viewName
        in: path
        required: true
        description: Name of the view
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CompositeView'
  /dashboarddataaccess/dashboardSequence:
    get:
      operationId: getDashboardSequence
      summary: Get dashboard widget sequence configuration
      tags:
      - ceo
      parameters:
      - name: persona
        in: query
        required: false
        description: Persona type (2 for CEO)
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/DashboardSequence'
  /employee/{employeeId}/quickie/job/details:
    get:
      operationId: getEmployeeJobDetails
      summary: Get quick job details for an employee
      tags:
      - employee
      parameters:
      - name: employeeId
        in: path
        required: true
        description: Numeric employee ID
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/EmployeeJobDetails'
  /engage/api/v1/employees/me/announcements:
    get:
      operationId: getMyAnnouncements
      summary: Retrieve announcements for the current employee
      tags:
      - Announcements
      parameters:
      - name: pageNumber
        in: query
        description: Page number for pagination (1-indexed)
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          minimum: 1
          default: 6
      - name: wallType
        in: query
        description: Type of announcement wall to filter by
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementListResponse'
  /engage/api/v1/employees/me/pulse/responses:
    get:
      operationId: getMyPulseResponses
      summary: Retrieve the current employee's pulse survey responses
      tags:
      - Pulse
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /engage/api/v1/employees/me/surveys/pending:
    get:
      operationId: getMyPendingSurveys
      summary: Retrieve pending surveys for the current employee
      tags:
      - Surveys
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyListResponse'
  /exit/dashboard/retention/metric:
    get:
      operationId: getRetentionMetrics
      summary: Get retention metrics for exit dashboard
      tags:
      - exit
      parameters:
      - name: startDate
        in: query
        required: true
        description: Start date for retention metrics
        schema:
          type: string
      - name: endDate
        in: query
        required: true
        description: End date for retention metrics
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/RetentionMetric'
  /exit/settings:
    get:
      operationId: getExitSettings
      summary: Get exit/resignation settings configuration
      tags:
      - exit
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ExitSettings'
  /exit/summary:
    get:
      operationId: getExitSummary
      summary: Get exit request summary counts
      tags:
      - exit
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ExitSummary'
  /exittasks/summary/dashboard:
    get:
      operationId: getExitTasksSummary
      summary: Get exit tasks summary for dashboard
      tags:
      - exit
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ExitTasksSummary'
  /expense/claims/advance/pending:
    get:
      operationId: getPendingAdvanceRequests
      summary: Get list of pending advance requests
      tags:
      - expense
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayResponse'
  /expense/claims/past:
    get:
      operationId: getPastExpenseClaims
      summary: Get list of past/processed expense claims
      tags:
      - expense
      parameters:
      - name: paidFromDate
        in: query
        required: false
        description: Filter by payment start date
        schema:
          type: string
          format: date
      - name: paidToDate
        in: query
        required: false
        description: Filter by payment end date
        schema:
          type: string
          format: date
      - name: approvedFromDate
        in: query
        required: false
        description: Filter by approval start date
        schema:
          type: string
          format: date
      - name: approvedToDate
        in: query
        required: false
        description: Filter by approval end date
        schema:
          type: string
          format: date
      - name: searchKey
        in: query
        required: false
        description: Search keyword
        schema:
          type: string
      - name: isSettlementClaims
        in: query
        required: false
        description: Filter for settlement claims only
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ExpenseClaimPast'
  /expense/claims/pending:
    get:
      operationId: getPendingExpenseClaims
      summary: Get list of pending expense claims
      tags:
      - expense
      parameters:
      - name: isSettlementClaims
        in: query
        required: false
        description: Filter for settlement claims only
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ExpenseClaim'
  /expense/claims/pendingapprovalscount:
    get:
      operationId: getExpensePendingApprovalsCount
      summary: Get count of pending expense claim approvals
      tags:
      - expense
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ExpenseApprovalsCount'
  /inbox/asset/acknowledgement:
    get:
      operationId: getAssetAcknowledgements
      summary: Get pending asset acknowledgement requests
      tags:
      - inbox
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/AssetAcknowledgementRequest'
  /inbox/asset/acknowledgement/{requestIdentifier}:
    get:
      operationId: getAssetAcknowledgementDetails
      summary: Get details of a specific asset acknowledgement request
      tags:
      - inbox
      parameters:
      - name: requestIdentifier
