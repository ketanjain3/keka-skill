openapi: 3.0.3
info:
  title: Keka HR Payroll API
  description: API endpoints for the Keka HR Payroll module
  version: 1.0.0

paths:
  /payroll/api/payroll/lookups/salarycomponent/recurring:
    get:
      operationId: getRecurringSalaryComponents
      summary: Retrieve all recurring salary components configured in the system
      tags:
        - Payroll Lookups
      responses:
        '200':
          description: Successful response with list of recurring salary components
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalaryComponent'
                  succeeded:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Response message
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages if any

  /payroll/api/payroll/lookups/isindianpayrollconfigured:
    get:
      operationId: isIndianPayrollConfigured
      summary: Check if Indian payroll is configured for the organization
      tags:
        - Payroll Lookups
      responses:
        '200':
          description: Successful response indicating Indian payroll configuration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    description: True if Indian payroll is configured, false otherwise
                  succeeded:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Response message
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages if any

  /payroll/api/payroll/lookups/isLWFEnabled:
    get:
      operationId: isLwfEnabled
      summary: Check if Labour Welfare Fund (LWF) is enabled for the organization
      tags:
        - Payroll Lookups
      responses:
        '200':
          description: Successful response indicating LWF enablement status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    description: True if LWF is enabled, false otherwise
                  succeeded:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Response message
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages if any

  /payroll/api/payroll/lookups/issocialinsuranceenabled:
    get:
      operationId: isSocialInsuranceEnabled
      summary: Check if social insurance is enabled for the organization
      tags:
        - Payroll Lookups
      responses:
        '200':
          description: Successful response indicating social insurance enablement status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    description: True if social insurance is enabled, false otherwise
                  succeeded:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Response message
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages if any

  /payroll/api/payroll/lookups/paygroupview:
    get:
      operationId: getPayGroupViews
      summary: Retrieve all pay groups configured in the system
      tags:
        - Payroll Lookups
      responses:
        '200':
          description: Successful response with list of pay groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayGroupView'
                  succeeded:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Response message
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages if any

  /payroll/api/payroll/lookups/configuredcurrencies:
    get:
      operationId: getConfiguredCurrencies
      summary: Retrieve all currencies configured for payroll
      tags:
        - Payroll Lookups
      responses:
        '200':
          description: Successful response with list of configured currencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Currency'
                  succeeded:
                    type: boolean
                    description: Indicates if the request was successful
                  message:
                    type: string
                    description: Response message
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages if any

components:
  schemas:
    SalaryComponent:
      type: object
      description: Represents a recurring salary component
      properties:
        name:
          type: string
          description: Unique identifier name of the salary component
        title:
          type: string
          description: Display title of the salary component
        headType:
          type: integer
          description: Type of salary head (1=Allowance, 2=Deduction, 5=Tax, 6=Base, 8=Loan)
        autoComputed:
          type: boolean
          description: Indicates if the component is automatically computed
        amountExpression:
          type: string
          description: Formula expression for calculating the component amount
        isNegativeValueAllowed:
          type: boolean
          description: Indicates if negative values are allowed for this component

    PayGroupView:
      type: object
      description: Represents a pay group configuration
      properties:
        id:
          type: integer
          description: Unique identifier of the pay group
        identifier:
          type: string
          format: uuid
          description: UUID identifier of the pay group
        name:
          type: string
          description: Name of the pay group
        description:
          type: string
          description: Description of the pay group
        employeesAssigned:
          type: integer
          description: Number of employees assigned to this pay group
        legalEntityId:
          type: integer
          description: ID of the associated legal entity
        legalEntityIdentifier:
          type: string
          format: uuid
          description: UUID identifier of the legal entity
        legalEntityName:
          type: string
          description: Name of the legal entity
        financialYearStartMonth:
          type: integer
          description: Month when the financial year starts (1-12)
        countryCode:
          type: string
          description: ISO country code
        currencyId:
          type: integer
          description: ID of the currency used
        currencyCode:
          type: string
          description: ISO currency code
        precision:
          type: integer
          description: Decimal precision for currency amounts
        isDefault:
          type: boolean
          description: Indicates if this is the default pay group
        firstCycle:
          type: string
          format: date
          description: Start date of the first pay cycle
        kekaStartsFrom:
          type: string
          format: date
          description: Date when Keka payroll processing started
        lastFinalizedCycle:
          $ref: '#/components/schemas/PayCycle'
        lastCompletelyFinalizedCycle:
          $ref: '#/components/schemas/PayCycle'
        lastPayrollRun:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last payroll run
        firstPendingCycle:
          $ref: '#/components/schemas/PayCycle'
        payrollProviderId:
          type: string
          format: uuid
          description: UUID of the payroll provider
        payrollProvider:
          type: string
          nullable: true
          description: Name of the payroll provider
        remunerationTypes:
          type: array
          items:
            type: integer
          description: List of remuneration type identifiers
        isSetUpComplete:
          type: boolean
          description: Indicates if pay group setup is complete
        paygroupFirstCycle:
          $ref: '#/components/schemas/PayCycle'
        isGlobalPayrollApplicable:
          type: boolean
          description: Indicates if global payroll is applicable

    PayCycle:
      type: object
      description: Represents a payroll cycle
      properties:
        id:
          type: integer
          description: Unique identifier of the pay cycle
        identifier:
          type: string
          format: uuid
          nullable: true
          description: UUID identifier of the pay cycle
        payGroupId:
          type: integer
          description: ID of the associated pay group
        from:
          type: string
          format: date
          description: Start date of the pay cycle
        to:
          type: string
          format: date
          description: End date of the pay cycle
        frequency:
          type: integer
          description: Pay frequency (1=Monthly)
        month:
          type: integer
          description: Month number (1-12)
        monthName:
          type: string
          description: Abbreviated month name
        monthNameYear:
          type: string
          description: Month and year display string
        year:
          type: integer
          description: Year of the pay cycle
        status:
          type: integer
          description: Status code of the pay cycle
        approvalStatus:
          type: integer
          description: Approval status code
        processedOn:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the cycle was processed
        isPending:
          type: boolean
          description: Indicates if the cycle is pending
        isInFinalState:
          type: boolean
          description: Indicates if the cycle is in final state
        oldAttendanceCutoffDate:
          type: string
          format: date
          nullable: true
          description: Previous attendance cutoff date
        attendanceCutoffDate:
          type: string
          format: date
          nullable: true
          description: Current attendance cutoff date
        isPreviousCycleFinalized:
          type: boolean
          description: Indicates if the previous cycle is finalized
        oldPayCycleEndDate:
          type: string
          format: date
          nullable: true
          description: Previous pay cycle end date
        isCycleProcessInProgress:
          type: boolean
          description: Indicates if cycle processing is in progress

    Currency:
      type: object
      description: Represents a currency configuration
      properties:
        id:
          type: integer
          description: Unique identifier of the currency
        code:
          type: string
          description: ISO currency code
        name:
          type: string
          description: Full name of the currency
        symbol:
          type: string
          nullable: true
          description: Currency symbol
        sortOrder:
          type: integer
          description: Display sort order
        precision:
          type: integer
          description: Decimal precision for amounts
        currencyName:
          type: string
          nullable: true
          description: Alternative currency name
        subUnit:
          type: string
          nullable: true
          description: Name of the currency sub-unit
